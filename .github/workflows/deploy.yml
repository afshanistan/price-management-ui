# Builds the app and Storybook on every push to main and publishes both to GitHub Pages.
#   App:       https://<user>.github.io/<repo>/
#   Storybook: https://<user>.github.io/<repo>/storybook/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build app
        run: npm run build
        env:
          # Matches the repo name, so the site works even if the repo is renamed.
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Build Storybook
        run: npx storybook build -o dist/storybook --quiet --disable-telemetry
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
